services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - ../../.env.test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:v1.17.0
    env_file:
      - ../../.env.test
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat /dev/null > /dev/tcp/localhost/${QDRANT_PORT:-6333}'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  wiremock:
    build:
      context: ../../
      dockerfile: wiremock/Dockerfile.wiremock
    command: --global-response-templating --verbose

  tests:
    build:
      context: ../../
      dockerfile: services/document_service/Dockerfile.test
    env_file:
      - ../../.env.test
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      wiremock:
        condition: service_started