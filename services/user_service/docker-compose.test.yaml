services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - ../../.env.test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-project_db_test}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  tests:
    build:
      context: ../../
      dockerfile: services/user_service/Dockerfile.test
    env_file:
      - ../../.env.test
    depends_on:
      postgres:
        condition: service_healthy