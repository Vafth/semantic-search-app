version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: project_db_test
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-project_db_test}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:v1.17.0
    environment:
      - QDRANT__TELEMETRY_DISABLED=true
      - QDRANT__SERVICE__MAX_WORKERS=2
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat /dev/null > /dev/tcp/localhost/${QDRANT_PORT:-6333}'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

wiremock:
  image: wiremock/wiremock:3.3.1
  volumes:
    - ./tests/wiremock:/home/wiremock
  command: >
    sh -c "
      echo '=== /home/wiremock ===' &&
      ls -la /home/wiremock/ &&
      echo '=== /home/wiremock/mappings ===' &&
      ls -la /home/wiremock/mappings/ 2>/dev/null || echo 'NO MAPPINGS DIR' &&
      echo '=== /home/wiremock/__files ===' &&
      ls -la /home/wiremock/__files/ 2>/dev/null || echo 'NO __FILES DIR' &&
      echo '=== Starting WireMock ===' &&
      java -jar /var/wiremock/lib/wiremock-standalone.jar --root-dir /home/wiremock --global-response-templating --verbose
    "

  tests:
    build:
      context: ../../
      dockerfile: services/search_service/Dockerfile.test
    env_file:
      - .env.test
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      wiremock:
        condition: service_started