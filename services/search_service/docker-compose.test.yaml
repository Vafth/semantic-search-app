version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: project_db_test
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-project_db_test}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:v1.17.0
    environment:
      - QDRANT__TELEMETRY_DISABLED=true
      - QDRANT__SERVICE__MAX_WORKERS=2
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat /dev/null > /dev/tcp/localhost/${QDRANT_PORT:-6333}'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  wiremock:
    image: wiremock/wiremock:3.3.1
    volumes:
      - ./tests/wiremock:/home/wiremock
    command: ["--global-response-templating"]

  tests:
    build:
      context: ../../
      dockerfile: services/search_service/Dockerfile.test
    environment:
      - POSTGRES_URL=postgresql+asyncpg://admin:password123@postgres:5432/project_db_test
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - MODEL_SERVICE_URL=http://wiremock:8080
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      wiremock:
        condition: service_started