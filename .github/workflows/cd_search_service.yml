name: CD - search_service

on:
  push:
    branches: [main]
    paths:
      - 'services/search_service/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v4
      
      - name: Run tests
        run: |
          cd services/search_service
          docker-compose -f docker-compose.test.yaml --env-file .env.test up --build --abort-on-container-exit
      
      - name: Cleanup
        if: always()
        run: |
          cd services/search_service
          docker-compose -f docker-compose.test.yaml down -v

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: services/search_service
          push: true
          tags: ghcr.io/${{ github.repository }}/search_service:latest